# Build configuration for the NeoForge 1.21.1 port of Immersive Industry.
#
# Upstream 1.20.1 used ForgeGradle + Parchment + MixinGradle. NeoForge 1.21.1
# builds with ModDevGradle, which supplies the official Mojang mappings and the
# mixin toolchain itself, so those three plugins are no longer needed.

# Sets default memory used for gradle commands.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

minecraft_version=1.21.1
neo_version=21.1.252
mod_version=0.3.0

# Third-party APIs. Shipped as local jars under libs/ because the Maven hosts
# that serve them are not reachable from this build machine.
jei_version=19.27.0.340
ie_version=1.21.1-12.4.2-194
