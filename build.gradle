// Build script for the NeoForge 1.21.1 port of Immersive Industry.
//
// Upstream targeted Forge 1.20.1 through ForgeGradle 6 + Parchment + MixinGradle.
// NeoForge 1.21.1 builds with ModDevGradle, which provides the official Mojang
// mappings and wires mixin into the runs itself, so those three are gone.
//
// Third-party APIs come from the public maven repositories; versions match
// the values in gradle.properties.

plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${minecraft_version}-${mod_version}"
group = 'com.teammoeg'

base {
    archivesName = 'ImmersiveIndustry'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets {
    main {
        resources {
            srcDirs = [
                    'src/main/resources',
                    'src/generated/resources'
            ]
        }
    }
    // NOTE: upstream's separate `datagen` source set is intentionally not declared here.
    // ModDevGradle's data() run only puts the mod's *main* output on the transforming
    // class path, so a second source set made mixin fail with ClassNotFoundException for
    // the mod's own mixin classes. The two datagen classes are picked up from src/main.
}

neoForge {
    version = project.neo_version

    // META-INF/accesstransformer.cfg is picked up automatically.

    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
            programArguments.addAll '--mod', 'immersiveindustry',
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }
}

repositories {
    mavenCentral()
    // IE, JEI and DualCodecs are all published here.
    maven { url = 'https://maven.blamejared.com/' }
}

dependencies {
    compileOnly "blusunrize.immersiveengineering:ImmersiveEngineering:${ie_version}"
    runtimeOnly "blusunrize.immersiveengineering:ImmersiveEngineering:${ie_version}"

    compileOnly "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
    runtimeOnly "mezz.jei:jei-1.21.1-neoforge:${jei_version}"

    // IE declares IERecipeSerializer#codecs() in terms of DualMapCodec and ships the library
    // jar-in-jar, which does not put it on the compile classpath, so it is needed explicitly.
    compileOnly "malte0811:DualCodecs:0.1.2"
}
jar {
    manifest {
        attributes([
                "Specification-Title"     : "Immersive Industry",
                "Specification-Vendor"    : "TeamMoeg",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : "TeamMoeg",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.register('sourcesJar', Jar) {
    dependsOn classes
    from sourceSets.main.allSource
    archiveClassifier.set('sources')
}

artifacts {
    archives sourcesJar
}
